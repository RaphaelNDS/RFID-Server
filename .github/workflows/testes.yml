# Roda os testes do servidor a cada push (qualquer branch) e em pull requests.
# Se algum teste falhar, o relatório HTML fica disponível para download na página da execução (Artifacts).
name: Testes

on:
  push:
  pull_request:

# Um push novo na mesma branch cancela a execução anterior, que ficou desatualizada
concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testes:
    name: ./gradlew test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Guarda as dependências do Gradle entre execuções (builds seguintes ficam bem mais rápidos)
      - name: Preparar o Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Rodar os testes
        run: ./gradlew test --console=plain

      - name: Guardar o relatório dos testes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes
          path: build/reports/tests/test/
          retention-days: 14
