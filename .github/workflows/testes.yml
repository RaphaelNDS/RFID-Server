# Roda os testes do servidor em pull requests e a cada push na master.
# Antes rodava a cada push em qualquer branch E no pull request: cada commit de um PR rodava duas vezes.
# Commit só de documentação (*.md, docs/) não roda nada.
# Se algum teste falhar, o relatório HTML fica disponível para download na página da execução (Artifacts).
name: Testes

on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']

# Um push novo no mesmo PR (ou na master) cancela a execução anterior, que ficou desatualizada
concurrency:
  group: testes-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testes:
    name: ./gradlew test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Guarda as dependências do Gradle entre execuções (builds seguintes ficam bem mais rápidos)
      - name: Preparar o Gradle
        uses: gradle/actions/setup-gradle@v4

      # Os testes sobem um PostgreSQL temporário (Testcontainers): o runner ubuntu já vem com o Docker
      - name: Rodar os testes
        run: ./gradlew test --console=plain

      - name: Guardar o relatório dos testes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes
          path: build/reports/tests/test/
          retention-days: 14

  # Produção é Windows e o job acima é Linux: aqui rodam os testes que não precisam de Docker (o runner Windows não
  # tem) e o iniciar-servidor.bat de verdade no cmd, para pegar o que só quebra no Windows (caminhos, sintaxe do .bat)
  windows:
    name: Windows (sem Docker) e iniciar-servidor.bat
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar o Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Rodar os testes que não sobem banco
        run: ./gradlew test -PsemDocker --console=plain

      - name: Conferir o iniciar-servidor.bat
        shell: pwsh
        run: ./scripts/windows/testar-iniciar-servidor.ps1

      - name: Guardar o relatório dos testes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-windows
          path: build/reports/tests/test/
          retention-days: 14
