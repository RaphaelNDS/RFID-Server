# Perfil usado pelos testes de integração (@ActiveProfiles("test")).
# PostgreSQL de verdade num contêiner temporário (Testcontainers sobe o contêiner na primeira conexão e o
# derruba no fim; precisa do Docker ligado). Mesma versão do docker/docker-compose.yml de produção.
spring:
  datasource:
    # TC_DAEMON: o contêiner fica de pé até o fim dos testes. Sem isso o Testcontainers o derruba quando a última
    # conexão fecha, e as migrações usam conexão própria (fora do pool): o banco migrado sumia antes de a aplicação usar
    url: jdbc:tc:postgresql:16-alpine:///rfid-teste?TC_DAEMON=true
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: rfid
    password: rfid
  jpa:
    show-sql: false

rfid:
  leituras:
    # Sem cache dos atalhos de dia: o contexto do Spring é o mesmo entre os testes, e cada teste grava as suas
    cache-dias-segundos: 0
  banco:
    # O banco de teste nasce vazio (não faz backup), mas sem Docker de produção o comando nem existiria
    backup-antes-migracao: ""
    # Sem o contêiner de backup: a conferência do dump tem testes próprios (BackupBancoServiceTest)
    conferir-dump: ""
  # Sem gravar o arquivo de "no ar" na pasta do projeto (o MonitorServidorServiceTest usa uma pasta temporária)
  monitor:
    arquivo-no-ar: ""
  dispositivos:
    # coletor-leitura existe para testar um coletor válido SEM permissão de cadastro
    chaves: coletor-teste:chave-de-teste-0123456789,coletor-leitura:chave-de-leitura-0123456789
    cadastro: coletor-teste
    # Todos os testes vêm de 127.0.0.1 e vários mandam chave errada de propósito: com o limite de produção (20)
    # os testes seguintes seriam bloqueados com 429. O limite em si é testado no ChaveDispositivoFilterTest
    max-chaves-erradas: 100000
  app:
    # APKs de teste (src/test/resources/apk, gerados por gerar-apks-teste.sh) são assinados com a chave de
    # teste "A": esta é a impressão digital dela. Os testes limpam a pasta antes de cada caso.
    pasta: ./build/test-app
    certificado-sha256: 67:5C:77:B8:E4:3A:D3:36:3D:EA:AA:C9:6E:C9:07:DC:49:93:E8:67:9E:C5:49:A8:04:03:87:C1:E5:B3:F5:AC
  coletores:
    # Limite baixo para o teste de inundação não precisar enviar 500 erros
    erros-por-dia: 60
  # Nenhum teste gera certificado em disco (os testes do certificado usam pasta temporária)
  https:
    habilitado: false

logging:
  # Testes não gravam log em arquivo (o padrão grava em ./data/logs)
  file:
    name: ""
  level:
    root: WARN
    org.example: WARN
