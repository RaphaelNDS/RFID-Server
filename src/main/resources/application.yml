server:
  # Com o HTTPS ligado (rfid.https), esta porta só redireciona para o HTTPS (ver HttpsConfig)
  port: 8082
  servlet:
    session:
      # Sessão das telas: sem nenhuma requisição por este tempo, o login acaba. Explícito (era o padrão implícito do
      # Tomcat). A conexão em tempo real do dashboard (SSE) NÃO conta como uso: com a aba aberta e ninguém mexendo,
      # ela é encerrada e a sessão também, depois deste mesmo tempo (LeituraEventosService)
      timeout: ${RFID_SESSAO_WEB_TIMEOUT:30m}

spring:
  # Servidor de email dos avisos (1.5.1, rfid.alertas): vazio = avisos só no log e na tela Status. Ex. Microsoft 365:
  # host smtp.office365.com, porta 587, usuário = o email que envia (com SMTP autenticado liberado para ele)
  mail:
    host: ${RFID_SMTP_HOST:}
    port: ${RFID_SMTP_PORTA:587}
    username: ${RFID_SMTP_USUARIO:}
    password: ${RFID_SMTP_SENHA:}
    properties:
      mail.smtp.auth: ${RFID_SMTP_AUTENTICAR:true}
      mail.smtp.starttls.enable: ${RFID_SMTP_STARTTLS:true}
      mail.smtp.starttls.required: ${RFID_SMTP_STARTTLS:true}
      # Prazos: o SMTP fora do ar não pode prender a linha de envio dos avisos
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 15000
      mail.smtp.writetimeout: 15000
  datasource:
    # PostgreSQL no Docker (docker/docker-compose.yml). Porta 5433, e não a padrão 5432, para não disputar com
    # outro PostgreSQL da máquina; o contêiner só aceita conexão da própria máquina.
    # A senha fica fora do git: config/application.properties (spring.datasource.password) ou RFID_DB_PASSWORD,
    # a mesma do docker/.env.
    url: ${RFID_DB_URL:jdbc:postgresql://localhost:5433/rfid}
    username: ${RFID_DB_USER:rfid}
    password: ${RFID_DB_PASSWORD:}
    # Prazos do banco: sem eles, um PostgreSQL travado ou uma rede que some no meio de uma consulta prendiam as
    # threads para sempre (o pool esgotava e o servidor parava de responder sem nenhum log). Ficam nas propriedades
    # do driver, e não na URL, para valerem também com uma RFID_DB_URL própria.
    hikari:
      # Conexões no pool (1.5.2; o padrão era 10). Com 20 ou 30 coletores sincronizando juntos no fim do turno, 10
      # não davam: as requisições esperavam os 5 s abaixo e caíam com erro, e os coletores reenviavam tudo. O
      # PostgreSQL aceita 100 conexões; sobra folga para o backup e para o psql
      maximum-pool-size: ${RFID_DB_POOL:30}
      # Espera por uma conexão livre do pool (o padrão era 30 s)
      connection-timeout: 5000
      # Conexão parada no pool é testada a cada 2 min: descobre antes de usar a que o banco ou a rede derrubou
      keepalive-time: 120000
      data-source-properties:
        # Abrir a conexão: até 5 s (em segundos)
        connectTimeout: 5
        # Resposta do banco: até 60 s sem nenhum byte e a conexão é dada como perdida (em segundos)
        socketTimeout: 60
        tcpKeepAlive: true
        # Cada comando SQL pode levar até 60 s; acima disso o PostgreSQL o cancela e o erro aparece no log.
        # As migrações usam conexão própria, sem esse limite (abaixo); a retenção de leituras apaga em partes
        options: "-c statement_timeout=60000"

  # O schema é criado e evoluído pelo Flyway (src/main/resources/db/migration).
  # O Hibernate só confere se as entidades batem com as tabelas.
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Conexão própria, fora do pool: as migrações não têm o limite de 60 s por comando nem o socketTimeout acima
    # (criar um índice numa tabela grande pode levar minutos). Mesmo banco, usuário e senha da aplicação
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}

  # Tarefas agendadas (retenção de leituras, backup do certificado, aviso do backup do banco, limpezas): com uma
  # thread só (o padrão), uma tarefa demorada atrasava todas as outras
  task:
    scheduling:
      pool:
        size: 3

  # Envio do APK na tela "App dos coletores" (o padrão do Spring é 1 MB). Envio de arquivo só passa no POST de
  # /admin/app por um ADMIN logado (EnvioArquivoFilter, antes do CsrfFilter): nas outras rotas, ou sem login, é
  # recusado sem ler o corpo. O serviço também para de gravar ao passar de 100 MB.
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 101MB
      resolve-lazily: true

  jpa:
    hibernate:
      ddl-auto: validate
    # Mostra no log cada SQL executado. Desligado: em produção lota o log (cada leitura gera vários SQLs).
    # Ligue só para investigar um problema (RFID_MOSTRAR_SQL=true).
    show-sql: ${RFID_MOSTRAR_SQL:false}
    # Desligado aqui e ligado à mão para as telas (SessaoJpaTelasConfig, 1.5.2): as telas leem coleções lazy ao montar
    # o HTML (permissões dos usuários) e precisam dele. A API dos coletores (/api/android) e o fluxo ao vivo do painel
    # (/admin/sse) ficam sem: com ele, cada requisição segurava uma conexão do banco do começo ao fim (um lote de 500
    # leituras inteiro; o fluxo ao vivo, enquanto a aba ficasse aberta), e o pool esgotava com muitos coletores.
    open-in-view: false


rfid:
  banco:
    # Backup do banco antes de aplicar migrações (versão nova do servidor que muda as tabelas): pede um pg_dump
    # ao contêiner de backup (grava em docker\backups\last). Se falhar, a migração não é aplicada e o servidor
    # não sobe (o log diz o motivo). Vazio = migra sem backup. Banco vazio (primeira instalação) não faz backup.
    backup-antes-migracao: ${RFID_BACKUP_ANTES_MIGRACAO:docker exec rfid-backup /backup.sh}
    # Pasta onde o contêiner rfid-backup grava os dumps (a mesma do RFID_BACKUP_PASTA do docker\.env), relativa à
    # pasta do servidor. A tela de status mostra o último backup e avisa (também no log, a cada 6 h) quando passar
    # de "backup-atrasado-horas" sem backup bom ou quando a última tentativa gerar um arquivo vazio.
    pasta-backups: ${RFID_BANCO_PASTA_BACKUPS:./docker/backups}
    backup-atrasado-horas: ${RFID_BANCO_BACKUP_ATRASADO_HORAS:12}
    # Conferência do dump (1.4.6): o contêiner lê o arquivo inteiro com o pg_restore, sem gravar nada. Um dump cortado
    # (computador desligado no meio do backup) passa a aparecer como incompleto, e não "em dia". {arquivo} = nome do
    # dump na pasta last. Cada dump é conferido uma vez. Vazio = confere só o tamanho, como antes.
    conferir-dump: ${RFID_BANCO_CONFERIR_DUMP:docker exec rfid-backup pg_restore -f /dev/null /backups/last/{arquivo}}
    # Cópia do banco fora do computador (1.5.1): de hora em hora, o último dump inteiro vai CIFRADO (com rfid.backup.senha)
    # para esta pasta, por exemplo a do OneDrive da empresa: ${OneDriveCommercial}/Backups RFID/banco. Sem a senha não
    # copia (o banco não vai aberto para a nuvem). Guarda as "copia-externa-manter" mais recentes e avisa quando passar
    # de "copia-externa-atrasada-horas" sem cópia nova. Vazio = desligada.
    copia-externa: ${RFID_BANCO_COPIA_EXTERNA:}
    copia-externa-manter: ${RFID_BANCO_COPIA_MANTER:14}
    copia-externa-atrasada-horas: ${RFID_BANCO_COPIA_ATRASADA_HORAS:24}

  # Avisos por email (1.5.1): backup do banco atrasado ou incompleto, cópia fora do computador falhando e servidor que
  # ficou fora do ar (avisado quando volta). Precisa do spring.mail acima. Destinatários separados por vírgula.
  alertas:
    email-para: ${RFID_ALERTAS_EMAIL:}
    # Remetente: vazio = o usuário do SMTP
    email-de: ${RFID_ALERTAS_DE:}
    # O mesmo problema volta a avisar no máximo a cada tantas horas enquanto continuar
    repetir-horas: ${RFID_ALERTAS_REPETIR_HORAS:24}

  # Fora do ar: a hora é gravada neste arquivo a cada 5 min; ao subir, um buraco maior que "minutos-fora" vira aviso
  monitor:
    arquivo-no-ar: ${RFID_ARQUIVO_NO_AR:./data/servidor-no-ar.txt}
    minutos-fora: ${RFID_MINUTOS_FORA:30}

  dispositivos:
    # Chaves dos coletores Android que podem usar /api/android/**, no formato nome:chave
    # separados por vírgula (ex.: coletor-01:chave-longa-1,coletor-02:chave-longa-2).
    # O app envia a chave no header X-Chave-Dispositivo (Configurações do app).
    # Sem nenhuma chave configurada, o app Android fica bloqueado (401).
    chaves: ${RFID_CHAVES_DISPOSITIVOS:}
    # Coletores que podem cadastrar etiquetas pelo app, separados por vírgula (os mesmos nomes de "chaves",
    # ex.: coletor-01,coletor-02). Faz no coletor o papel da permissão RFID/CREATE da web.
    # Vazio = nenhum coletor cadastra (o app mostra "coletor sem permissão para cadastrar").
    cadastro: ${RFID_COLETORES_CADASTRO:}
    # Tamanho máximo do corpo de cada envio dos coletores (JSON), em bytes: acima disso, 413 antes de ler
    max-corpo-bytes: ${RFID_COLETORES_MAX_CORPO_BYTES:8388608}

  web:
    # Tamanho máximo do corpo das requisições das telas (formulários e JSON da API do catálogo), em bytes: acima
    # disso, 413 antes de ler. Envio de arquivo (APK) não entra aqui: tem limite próprio (spring.servlet.multipart)
    max-corpo-bytes: ${RFID_WEB_MAX_CORPO_BYTES:1048576}

  anexos:
    # Fotos e anexos do bem (1.9.0): tamanho máximo de cada arquivo (bytes) e quantos por bem. Ficam no banco
    max-bytes: ${RFID_ANEXOS_MAX_BYTES:10485760}
    max-por-bem: ${RFID_ANEXOS_MAX_POR_BEM:20}

  coletores:
    # Tela Coletores: sem contato há esta quantidade de dias, o coletor aparece destacado
    # ("Sem contato há muito tempo").
    dias-sem-contato: ${RFID_COLETORES_DIAS_SEM_CONTATO:7}
    # Erros do app enviados pelos coletores: limite por coletor por dia (contra app em loop de falha)
    # e por quantos dias ficam guardados (limpeza 10 min depois de o servidor subir e a cada 24 h).
    erros-por-dia: ${RFID_COLETORES_ERROS_POR_DIA:500}
    dias-erros: ${RFID_COLETORES_DIAS_ERROS:90}
    # Endereço do servidor no QR de configuração dos coletores (1.5.0), sem a porta (ex.: 172.16.242.22). Vazio = o
    # endereço pelo qual a tela foi aberta; aberta em localhost, o IP da rede local desta máquina.
    endereco-qr: ${RFID_ENDERECO_QR:}

  app:
    # Atualização do app dos coletores pelo servidor (tela "App dos coletores").
    # Pasta dos APKs publicados (fora do backup automático: em caso de perda, publique o APK de novo).
    pasta: ${RFID_APP_PASTA:./data/app}
    # Pacote do app: APK de outro pacote é recusado.
    pacote: ${RFID_APP_PACOTE:br.com.bkpbr.rfidandroid}
    # Impressão digital SHA-256 do certificado da chave de assinatura do app (keystore/rfid-android.jks):
    # só APK assinado com ela é publicado. Vazio = publicação desligada.
    # Ver com: keytool -list -v -keystore keystore/rfid-android.jks
    certificado-sha256: ${RFID_APP_CERTIFICADO_SHA256:30:3F:97:AA:EA:F8:D2:EE:2B:9C:25:E2:77:92:10:5B:83:76:31:54:5A:E9:66:DD:AC:60:F1:66:48:EF:6A:A2}
    # Quantas versões mantêm o arquivo no disco (as mais antigas ficam só no histórico).
    versoes-guardadas: ${RFID_APP_VERSOES_GUARDADAS:3}

  https:
    # HTTPS na porta abaixo. A porta HTTP antiga (server.port) passa a só redirecionar as telas para cá
    # e a recusar a API (erro 426 explicando o endereço HTTPS).
    habilitado: ${RFID_HTTPS_HABILITADO:true}
    porta: ${RFID_HTTPS_PORTA:8443}
    # Certificado (PKCS12). Se não existir, o servidor gera um próprio, válido por 10 anos, com os IPs desta
    # máquina, e guarda a senha em <arquivo>.senha. Se existir, só carrega: nunca gera outro sozinho (a
    # impressão digital está fixada nos coletores). O backup automático já leva o .p12 e o .senha.
    # Para um certificado da empresa, aponte para o .p12 dela e informe a senha.
    keystore: ${RFID_HTTPS_KEYSTORE:./data/rfid-https.p12}
    senha: ${RFID_HTTPS_SENHA:}
    # Nomes e IPs extras do certificado gerado, separados por vírgula (ex.: rfid-servidor,192.168.0.10).
    # Os IPs desta máquina e "localhost" já entram. Só vale ao GERAR o certificado (na primeira vez).
    nomes: ${RFID_HTTPS_NOMES:}

  operador:
    # Quanto tempo vale o login do operador no coletor (um turno). O app trabalha offline até esse limite;
    # ações feitas durante a sessão continuam valendo mesmo se forem enviadas depois que ela expirar.
    duracao-sessao: ${RFID_DURACAO_SESSAO_OPERADOR:12h}
    # Prazo máximo (relógio do servidor) para uma ação feita offline chegar ao servidor: o tempo que um coletor
    # pode ficar sem rede sem perder leituras. Depois do fim da sessão, o token ainda vale só por esse prazo e
    # só para ações feitas enquanto ela valia; passado o prazo, morre de vez (token vazado não serve para sempre).
    janela-sincronizacao: ${RFID_JANELA_SINCRONIZACAO:72h}

  leituras:
    # Tela de leituras: quantas por página (10 a 200).
    por-pagina: ${RFID_LEITURAS_POR_PAGINA:50}
    # Até quantas leituras a tela conta: acima disso mostra "mais de N" e navega por Anterior/Próxima (contar
    # milhões de leituras a cada página levava segundos).
    teto-contagem: ${RFID_LEITURAS_TETO_CONTAGEM:10000}
    # Retenção: apaga leituras com mais de N dias, 10 min depois de o servidor subir e a cada 24 h. 0 = desligada (guarda tudo).
    # Mínimo de 30 dias (leituras feitas offline chegam com a data antiga). Inventários não são afetados.
    # Apagar leituras muda os relatórios dos períodos apagados.
    reter-dias: ${RFID_LEITURAS_RETER_DIAS:0}

  senha:
    # Regras de senha (setup, cadastro de usuário e troca de senha): letras e números, sem o nome/email,
    # sem senhas comuns, até 72 caracteres (limite do BCrypt). Tamanho mínimo:
    tamanho-minimo: ${RFID_SENHA_TAMANHO_MINIMO:8}
    # Quanto tempo a senha temporária gerada pelo ADMIN vale para criar a senha nova (depois, só pedindo outra):
    prazo-temporaria: ${RFID_SENHA_PRAZO_TEMPORARIA:48h}

  login:
    # Proteção contra adivinhação de senha. Os erros são contados dentro de "bloqueio-minutos".
    # Erros seguidos no mesmo email, vindos da MESMA origem (IP na web, coletor@IP no coletor), que bloqueiam
    # aquele login só para essa origem (quem erra a senha do ADMIN de outra máquina não tranca o ADMIN):
    max-tentativas: ${RFID_LOGIN_MAX_TENTATIVAS:5}
    # Erros no mesmo email somando todas as origens que bloqueiam aquele login para todas (adivinhação distribuída):
    max-tentativas-email: ${RFID_LOGIN_MAX_TENTATIVAS_EMAIL:20}
    # Erros vindos do mesmo IP (em qualquer conta) que bloqueiam o IP:
    max-tentativas-ip: ${RFID_LOGIN_MAX_TENTATIVAS_IP:20}
    # Tempo de bloqueio (e janela de contagem), em minutos:
    bloqueio-minutos: ${RFID_LOGIN_BLOQUEIO_MINUTOS:15}

  backup:
    # Backup automático do certificado HTTPS (.p12 e .senha). O banco tem backup próprio: contêiner rfid-backup
    # do docker/docker-compose.yml. Restaurar: pare o servidor, extraia o .zip na pasta data e suba de novo.
    habilitado: ${RFID_BACKUP_HABILITADO:true}
    # Vazio = ./data/backups.
    # Recomendado apontar para outro disco ou pasta de rede: backup no mesmo disco não protege contra falha do disco.
    # Variável própria: RFID_BACKUP_PASTA é a pasta dos dumps do banco no docker\.env, e uma variável do Windows
    # com esse nome mudaria as duas pastas ao mesmo tempo.
    pasta: ${RFID_CERT_BACKUP_PASTA:}
    # Horário no formato cron do Spring (segundo minuto hora dia mês dia-da-semana). Padrão: todo dia às 02:00. Com o
    # computador desligado nesse horário, o backup é feito ao subir o servidor, se o último tiver mais de 24 h.
    cron: ${RFID_BACKUP_CRON:0 0 2 * * *}
    # Quantos backups guardar; os mais antigos são apagados.
    manter: ${RFID_BACKUP_MANTER:14}
    # Senha que cifra o backup (.zip.cifrado): o .zip leva a chave privada do HTTPS e a senha dela. Guarde-a FORA
    # desta máquina (sem ela o backup não restaura). Restaurar: java -jar rfid-server.jar --decifrar-backup arquivo
    # Vazio = .zip aberto (o servidor avisa no log ao subir).
    senha: ${RFID_BACKUP_SENHA:}


logging:
  # Além do console, o log vai para arquivo (para achar depois os erros pelo código mostrado ao usuário).
  # Vazio = só console. Rotação: um arquivo novo por dia ou a cada 10 MB; guarda 30 dias, no máximo 1 GB.
  file:
    name: ${RFID_LOG_ARQUIVO:./data/logs/rfid-server.log}
  charset:
    file: UTF-8
  # Quebra de linha dentro da mensagem vira " | ": um email digitado no login com uma quebra de linha não consegue
  # forjar uma linha inteira no log (que é o que se usa para investigar incidentes). Exceções (stack trace) saem
  # normalmente, em várias linhas, pelo %wEx.
  pattern:
    console: "%clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}){faint} %clr(%5p) %clr(--- [%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %replace(%m){'[\\r\\n]+',' | '}%n%wEx"
    file: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p --- [%t] %-40.40logger{39} : %replace(%m){'[\\r\\n]+',' | '}%n%wEx"
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB


# Monitoramento: GET https://<servidor>:8443/actuator/health responde {"status":"UP"} (ou DOWN, com 503, se o
# banco cair). Sem login e sem detalhes; nenhum outro endpoint do actuator fica exposto.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
  # O health não confere o servidor de email (1.5.1): sem SMTP configurado, ou com ele fora do ar, o servidor RFID ficaria
  # DOWN sem estar com problema. A falha de envio dos avisos aparece na tela Status
  health:
    mail:
      enabled: false
