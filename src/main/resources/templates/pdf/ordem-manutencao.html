<!DOCTYPE html>
<!-- Ordem de manutenção em PDF (1.11.0): para acompanhar o bem até o fornecedor e guardar com a nota do serviço -->
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <title th:text="'Ordem de manutenção nº ' + ${m.id}">Ordem</title>
  <style th:replace="~{pdf/base :: estilo}"></style>
</head>
<body>
<div th:replace="~{pdf/base :: rodape}"></div>
<div th:replace="~{pdf/base :: cabecalho('Ordem de manutenção', ${m.tipo.rotulo}, 'Nº ' + ${m.id} + ' - ' + ${fmt.data(m.dataEnvio)})}"></div>

<table class="dados">
  <tr><th>Bem</th><td th:text="${m.patrimonio ?: m.tagReal} + (${m.descricaoBem != null} ? ' - ' + ${m.descricaoBem} : '')"></td></tr>
  <tr><th>Etiqueta</th><td class="mono" th:text="${m.tagReal}"></td></tr>
  <tr><th>Problema / revisão</th><td th:text="${m.problema}"></td></tr>
  <tr><th>Fornecedor / técnico</th><td th:text="${m.fornecedor} ?: '-'"></td></tr>
  <tr><th>Envio</th><td th:text="${fmt.data(m.dataEnvio)}"></td></tr>
  <tr><th>Previsão de retorno</th><td th:text="${m.previsaoRetorno != null} ? ${fmt.data(m.previsaoRetorno)} : '-'"></td></tr>
  <tr><th>Aberta por</th><td th:text="${m.registradaPor} + ' em ' + ${#temporals.format(m.criadaEm, 'dd/MM/yyyy HH:mm')}"></td></tr>
  <tr><th>Situação</th><td th:text="${m.status.rotulo}"></td></tr>
  <tr th:if="${m.resultado != null}"><th>Resultado</th><td th:text="${m.resultado.rotulo}"></td></tr>
  <tr th:if="${m.servicoRealizado != null}"><th>Serviço realizado</th><td th:text="${m.servicoRealizado}"></td></tr>
  <tr th:if="${m.custo != null}"><th>Custo</th><td th:text="${fmt.reais(m.custo)}"></td></tr>
  <tr th:if="${m.concluidaEm != null}"><th>Encerrada</th><td th:text="${fmt.data(m.concluidaEm)} + ' por ' + ${m.concluidaPor}"></td></tr>
</table>

<table class="assinaturas">
  <tr>
    <td><div class="linha">&#160;</div><div class="muted">Entregue por</div></td>
    <td><div class="linha" th:text="${m.fornecedor} ?: ' '">&#160;</div><div class="muted">Recebido por (fornecedor / técnico)</div></td>
  </tr>
</table>
<p class="local-data">Local e data: ____________________________, ____ / ____ / ________</p>
</body>
</html>
