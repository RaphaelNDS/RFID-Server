<!DOCTYPE html>
<!-- Guia de transferência em PDF (1.8.0): a mesma guia da tela (transferencia-guia.html) -->
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <title th:text="'Guia de transferência nº ' + ${guia.id}">Guia</title>
  <style th:replace="~{pdf/base :: estilo}"></style>
</head>
<body>
<div th:replace="~{pdf/base :: rodape}"></div>
<div th:replace="~{pdf/base :: cabecalho('Guia de transferência de bens', null, 'Guia nº ' + ${guia.id} + ' - ' + ${fmt.data(guia.data)})}"></div>

<table class="dados">
  <tr><th>Local de destino</th><td th:text="${guia.localDestino} ?: 'mantido (cada bem continua onde estava)'"></td></tr>
  <tr><th>Responsável de destino</th><td th:text="${guia.responsavelDestino} ?: 'mantido (cada bem continua com quem estava)'"></td></tr>
  <tr th:if="${guia.solicitante != null}"><th>Solicitante</th><td th:text="${guia.solicitante}"></td></tr>
  <tr th:if="${guia.motivo != null}"><th>Motivo</th><td th:text="${guia.motivo}"></td></tr>
  <tr><th>Registrada por</th><td th:text="${guia.registradaPor} + ' em ' + ${#temporals.format(guia.criadaEm, 'dd/MM/yyyy HH:mm')}"></td></tr>
</table>

<table class="lista">
  <thead><tr><th>#</th><th>Patrimônio</th><th>Descrição</th><th>Etiqueta</th><th>Local anterior</th><th>Responsável anterior</th></tr></thead>
  <tbody>
  <tr th:each="i, n : ${itens}">
    <td th:text="${n.count}"></td>
    <td th:text="${i.patrimonio} ?: '-'"></td>
    <td th:text="${i.descricao} ?: '-'"></td>
    <td class="mono" th:text="${i.tagReal}"></td>
    <td th:text="${i.localAnterior} ?: '-'"></td>
    <td th:text="${i.responsavelAnterior} ?: '-'"></td>
  </tr>
  </tbody>
</table>
<p class="muted" th:text="'Total: ' + ${#lists.size(itens)} + ' bem(ns).'"></p>

<table class="assinaturas">
  <tr>
    <td><div class="linha">&#160;</div><div class="muted">Entregue por</div></td>
    <td><div class="linha" th:text="${guia.responsavelDestino} ?: ' '">&#160;</div><div class="muted">Recebido por</div></td>
  </tr>
</table>
<p class="local-data">Local e data: ____________________________, ____ / ____ / ________</p>
</body>
</html>
