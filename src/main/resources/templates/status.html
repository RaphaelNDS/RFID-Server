<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Status do Servidor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            padding: 40px;
        }
        .card {
            background: white;
            padding: 24px;
            border-radius: 8px;
            width: 360px;
            box-shadow: 0 2px 6px rgba(0,0,0,.1);
        }
        .ok {
            color: #2E7D32;
            font-weight: bold;
        }
    </style>
</head>
<body>

<h2>📡 Status do Servidor RFID</h2>

<div class="card">
    <p>Status: <span class="ok" th:text="${info.status}"></span></p>
    <p>Hora do servidor: <b th:text="${info.horaServidor}"></b></p>
    <p>Versão: <b th:text="${info.versao}"></b></p>
    <p>Banco: <b th:text="${info.banco}"></b></p>
</div>

<br>
<a href="/">← Voltar</a>

</body>
</html>
