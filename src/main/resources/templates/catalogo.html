<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="layout/base :: layout(~{::title}, ~{::section})">

<title>Catálogo de Equipamentos</title>

<section class="page-container">

  <h1 class="page-title">📦 Catálogo de Equipamentos</h1>

  <div th:if="${erro}" class="alert-error">
    <p th:text="${erro}"></p>
  </div>


  <div class="card-grid">

    <!-- TIPOS -->
    <div class="card">
      <h2>Tipos de Equipamento</h2>

      <form class="form-grid"
            th:action="@{/admin/catalogo/tipo}" method="post">
        <input type="text" name="nome" placeholder="Nome do tipo" required>
        <button type="submit">Adicionar</button>
      </form>

      <ul class="simple-list">
        <li th:each="t : ${tipos}" th:text="${t.nome}"></li>
      </ul>
    </div>

    <!-- MARCAS -->
    <div class="card">
      <h2>Marcas</h2>

      <form class="form-grid"
            th:action="@{/admin/catalogo/marca}" method="post">

        <select name="tipoId" required>
          <option value="">Tipo do equipamento</option>
          <option th:each="t : ${tipos}"
                  th:value="${t.id}"
                  th:text="${t.nome}">
          </option>
        </select>

        <input type="text" name="nome" placeholder="Nome da marca" required>
        <button type="submit">Adicionar</button>
      </form>

      <ul class="simple-list">
        <li th:each="m : ${marcas}">
          <b th:text="${m.nome}"></b>
          <small> — <span th:text="${m.tipo.nome}"></span></small>
        </li>
      </ul>
    </div>

    <!-- MODELOS -->
    <div class="card">
      <h2>Modelos</h2>

      <form class="form-grid"
            th:action="@{/admin/catalogo/modelo}" method="post">

        <select name="marcaId" required>
          <option value="">Marca</option>
          <option th:each="m : ${marcas}"
                  th:value="${m.id}"
                  th:text="${m.nome}">
          </option>
        </select>

        <input type="text" name="nome" placeholder="Nome do modelo" required>
        <button type="submit">Adicionar</button>
      </form>

      <ul class="simple-list">
        <li th:each="m : ${modelos}">
          <b th:text="${m.nome}"></b>
          <small> — <span th:text="${m.marca.nome}"></span></small>
        </li>
      </ul>
    </div>

  </div>

</section>
</html>
