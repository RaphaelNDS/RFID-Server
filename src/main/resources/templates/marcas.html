<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">

<title>Marcas · Sistema RFID</title>

<section class="page">

  <div class="page-header">
    <div>
      <h1>Marcas</h1>
      <p class="subtitulo">Todas as marcas cadastradas no catálogo</p>
    </div>
    <div class="page-header-acoes">
      <a th:href="@{/admin/catalogo}" class="btn btn-ghost">
        <svg class="ic"><use href="/img/icones.svg#voltar"/></svg>Voltar ao catálogo
      </a>
    </div>
  </div>

  <div class="card">
    <div class="table-wrap">
      <table class="table" th:unless="${#lists.isEmpty(marcas)}">
        <thead>
        <tr><th>ID</th><th>Marca</th><th>Tipo</th></tr>
        </thead>
        <tbody>
        <tr th:each="i : ${marcas}"><td class="muted" th:text="${i.id}"></td><td class="principal" th:text="${i.nome}"></td><td th:text="${i.tipo.nome}"></td></tr>
        </tbody>
      </table>
      <div class="vazio" th:if="${#lists.isEmpty(marcas)}">
        <svg class="ic"><use href="/img/icones.svg#pacote"/></svg>
        <strong>Nenhuma marca cadastrada</strong>
        Cadastre pela tela do catálogo.
      </div>
    </div>
  </div>

</section>
</html>
