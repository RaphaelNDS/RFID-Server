<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">

<title>Tags Não Cadastradas</title>

<section class="page-container">

  <h1 class="page-title">⚠️ Tags Não Cadastradas</h1>

  <div class="table-container">
    <table id="tbl">
      <thead>
      <tr>
        <th>Tag</th>
        <th>Data</th>
        <th>Ação</th>
      </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <br><br>

  <div class="card" style="max-width:600px">

    <h3>📝 Cadastrar Tag</h3>
    <br>

    <div style="display:grid; gap:10px">

      <input id="tag" placeholder="Tag" readonly>
      <input id="modelo" placeholder="Modelo">
      <input id="patrimonio" placeholder="Patrimônio">
      <input id="serie" placeholder="Número de série">

      <button onclick="cadastrar()">Cadastrar</button>

    </div>

  </div>

</section>

<script>
  async function carregar() {
      const res = await fetch('/api/tags/naocadastradas')
      const data = await res.json()

      const tbody = document.querySelector('#tbl tbody')
      tbody.innerHTML = ''

      data.forEach(t => {
          const tr = document.createElement('tr')
          tr.innerHTML = `
              <td>${t.tag}</td>
              <td>${t.dataHora}</td>
              <td><button onclick="selecionar('${t.tag}')">Cadastrar</button></td>
          `
          tbody.appendChild(tr)
      })
  }

  function selecionar(tag) {
      document.getElementById('tag').value = tag
  }

  async function cadastrar() {

      const body = {
          tag: document.getElementById('tag').value,
          modelo: document.getElementById('modelo').value,
          patrimonio: document.getElementById('patrimonio').value,
          numeroSerie: document.getElementById('serie').value
      }

      await fetch('/api/tags/cadastrar', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(body)
      })

      alert('Cadastrado com sucesso!')
      carregar()
  }

  carregar()
</script>

</html>
