<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">

<title>Movimentações · Sistema RFID</title>

<section class="page">

  <div class="page-header">
    <div>
      <h1>Movimentações</h1>
      <p class="subtitulo">Saídas e entradas de equipamentos do estoque</p>
    </div>
    <div class="page-header-acoes" th:if="${@authService.temPermissao('MOVIMENTO','CREATE')}">
      <a th:href="@{/admin/movimentos/saida}" class="btn btn-primary">
        <svg class="ic"><use href="/img/icones.svg#transferir"/></svg>Nova saída
      </a>
      <a th:href="@{/admin/movimentos/entrada}" class="btn btn-secondary">
        <svg class="ic"><use href="/img/icones.svg#ok"/></svg>Nova entrada
      </a>
    </div>
  </div>

  <div class="alert alert-ok" th:if="${msg}" role="status">
    <svg class="ic"><use href="/img/icones.svg#ok"/></svg><span th:text="${msg}"></span>
  </div>

  <div class="card">
    <form method="get" class="toolbar">
      <div class="field" style="flex:1 1 240px">
        <label for="busca">Equipamento, destino ou observação</label>
        <input id="busca" name="busca" type="search" th:value="${busca}" placeholder="Patrimônio, EPC, destino...">
      </div>
      <div class="field" style="flex:0 1 160px">
        <label for="f-tipo">Tipo</label>
        <select id="f-tipo" name="tipo">
          <option value="">Saídas e entradas</option>
          <option th:each="t : ${tipos}" th:value="${t.name()}" th:text="${t.rotulo}" th:selected="${filtro.tipo == t}"></option>
        </select>
      </div>
      <div class="field" style="flex:0 1 160px">
        <label for="f-de">De</label>
        <input type="date" id="f-de" name="de" th:value="${filtro.de}">
      </div>
      <div class="field" style="flex:0 1 160px">
        <label for="f-ate">Até</label>
        <input type="date" id="f-ate" name="ate" th:value="${filtro.ate}">
      </div>
      <button type="submit" class="btn btn-primary">
        <svg class="ic"><use href="/img/icones.svg#busca"/></svg>Filtrar
      </button>
      <a th:if="${busca != '' or filtro.ativo}" th:href="@{/admin/movimentos}" class="btn btn-ghost">Limpar</a>
    </form>

    <div class="card-header">
      <h2>Movimentações <span class="contagem" th:text="'(' + ${#numbers.formatInteger(total, 1, 'POINT')} + ')'"></span></h2>
    </div>

    <div class="table-wrap">
      <table class="table table-cartoes" th:unless="${#lists.isEmpty(movimentos)}">
        <thead>
        <tr>
          <th>Nº</th>
          <th>Data e hora</th>
          <th>Tipo</th>
          <th>Destino</th>
          <th>Equipamentos</th>
          <th>Registrado por</th>
          <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="d : ${movimentos}" th:with="m=${d.movimento}">
          <td class="principal cartao-titulo nowrap"><a th:href="@{/admin/movimentos/{id}(id=${m.id})}" th:text="'Nº ' + ${m.id}"></a></td>
          <td data-rotulo="Data e hora" class="nowrap" th:text="${#temporals.format(m.dataHora, 'dd/MM/yyyy HH:mm')}"></td>
          <td data-rotulo="Tipo">
            <span class="badge" th:classappend="${m.tipo.name() == 'SAIDA'} ? 'badge-CUSTOM' : 'badge-online'" th:text="${m.tipo.rotulo}"></span>
          </td>
          <td data-rotulo="Destino" th:text="${m.destino} ?: '—'"></td>
          <td data-rotulo="Equipamentos">
            <span th:text="${#lists.size(d.itens)}"></span>
            <span class="muted" th:if="${#lists.size(d.itens) <= 5}">
              <th:block th:each="i, st : ${d.itens}" th:text="(${st.first} ? ' · ' : ', ') + (${i.patrimonio} ?: ${i.tagReal})"></th:block>
            </span>
          </td>
          <td data-rotulo="Registrado por" th:text="${m.registradoPor} + ' (' + ${m.origem.rotulo} + ')'"></td>
          <td class="acoes">
            <a th:href="@{/admin/movimentos/{id}/comprovante.pdf(id=${m.id})}" class="btn btn-ghost btn-sm" target="_blank" rel="noopener"
               title="Comprovante em PDF">
              <svg class="ic"><use href="/img/icones.svg#download"/></svg><span class="texto-btn">PDF</span>
            </a>
          </td>
        </tr>
        </tbody>
      </table>

      <div class="vazio" th:if="${#lists.isEmpty(movimentos)}">
        <svg class="ic"><use href="/img/icones.svg#pacote"/></svg>
        <p th:text="${busca != '' or filtro.ativo} ? 'Nenhuma movimentação com estes filtros.' : 'Nenhuma saída ou entrada registrada ainda.'"></p>
      </div>
    </div>

    <nav th:replace="~{layout/paginacao :: paginacao}"></nav>
  </div>

</section>
</html>
