<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">

<title>Linha do tempo · Sistema RFID</title>

<section class="page page-estreita" th:with="t=${l.tag},r=${l.resumo}">

  <div class="page-header">
    <div>
      <h1 th:text="'Linha do tempo · ' + (${t.patrimonio} ?: ${t.tagReal})">Linha do tempo</h1>
      <p class="subtitulo">
        <span class="badge" th:text="${t.situacao.rotulo}"></span>
        <span class="mono" th:text="${t.tagReal}"></span>
      </p>
    </div>
    <div class="page-header-acoes">
      <a th:if="${@authService.temPermissao('RFID','UPDATE')}" th:href="@{/admin/etiquetas/{id}/editar(id=${t.id})}" class="btn btn-ghost">
        <svg class="ic"><use href="/img/icones.svg#voltar"/></svg>Etiqueta
      </a>
      <a th:href="@{/admin/etiquetas/historico(tag=${t.tagReal})}" class="btn btn-ghost">
        <svg class="ic"><use href="/img/icones.svg#relogio"/></svg>Histórico dos campos
      </a>
    </div>
  </div>

  <div class="grid grid-stats">
    <div class="stat">
      <div class="stat-rotulo"><svg class="ic"><use href="/img/icones.svg#calendario"/></svg>Locações</div>
      <div class="stat-valor" th:text="${r.locacoes}">0</div>
      <div class="stat-dica" th:text="${r.clientes} + ' cliente(s) · ' + ${r.diasAlugado} + ' dia(s) alugado'"></div>
    </div>
    <div class="stat">
      <div class="stat-rotulo"><svg class="ic"><use href="/img/icones.svg#lapis"/></svg>Manutenções</div>
      <div class="stat-valor" th:text="${r.manutencoes}">0</div>
      <div class="stat-dica" th:text="'custo total ' + ${fmt.reais(r.custoManutencao)}"></div>
    </div>
    <div class="stat">
      <div class="stat-rotulo"><svg class="ic"><use href="/img/icones.svg#alerta"/></svg>Avarias na devolução</div>
      <div class="stat-valor" th:classappend="${r.avarias > 0} ? 'negativo'" th:text="${r.avarias}">0</div>
      <div class="stat-dica">Com avaria ou faltando acessório</div>
    </div>
    <div class="stat">
      <div class="stat-rotulo"><svg class="ic"><use href="/img/icones.svg#usuarios"/></svg>Último cliente</div>
      <div class="stat-valor" style="font-size:16px" th:text="${r.ultimoCliente} ?: '—'">—</div>
    </div>
  </div>

  <div class="card" style="margin-top:16px">
    <ul class="linha-tempo" th:unless="${#lists.isEmpty(l.eventos)}">
      <li th:each="e : ${l.eventos}" th:classappend="${e.alerta} ? 'alerta'">
        <span class="lt-icone"><svg class="ic"><use th:href="'/img/icones.svg#' + ${e.tipo.icone}"/></svg></span>
        <div class="lt-corpo">
          <div class="lt-topo">
            <a th:if="${e.link != null}" th:href="${e.link}" th:text="${e.titulo}"></a>
            <strong th:unless="${e.link != null}" th:text="${e.titulo}"></strong>
            <span class="muted nowrap" th:text="${#temporals.format(e.momento, 'dd/MM/yyyy HH:mm')}"></span>
          </div>
          <div class="muted" th:if="${e.detalhe != null}" th:text="${e.detalhe}"></div>
          <div class="muted lt-por" th:if="${e.por != null}" th:text="${e.por}"></div>
        </div>
      </li>
    </ul>
    <div class="vazio" th:if="${#lists.isEmpty(l.eventos)}">Nada registrado ainda para este equipamento.</div>
  </div>

</section>
</html>
