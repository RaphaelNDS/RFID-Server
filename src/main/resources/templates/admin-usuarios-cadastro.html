<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">

<title>Novo usuário · Sistema RFID</title>

<section class="page page-estreita">

  <div class="page-header">
    <div>
      <h1>Novo usuário</h1>
      <p class="subtitulo">O email será o login. As permissões valem a partir do próximo login do usuário.</p>
    </div>
    <div class="page-header-acoes">
      <a th:href="@{/admin/usuarios}" class="btn btn-ghost">
        <svg class="ic"><use href="/img/icones.svg#voltar"/></svg>Voltar para a lista
      </a>
    </div>
  </div>

  <div class="alert alert-erro" th:if="${erro}" role="alert">
    <svg class="ic"><use href="/img/icones.svg#alerta"/></svg><span th:text="${erro}"></span>
  </div>
  <div class="alert alert-ok" th:if="${msg}" role="status">
    <svg class="ic"><use href="/img/icones.svg#ok"/></svg><span th:text="${msg}"></span>
  </div>

  <form class="card" th:action="@{/admin/usuarios/cadastrar}" method="post">
    <div class="card-body">
      <div class="form-grid">

        <div class="field">
          <label for="nome">Nome <span class="obrigatorio">*</span></label>
          <input id="nome" name="nome" th:value="${form?.nome}" autocomplete="off" required>
        </div>

        <div class="field">
          <label for="email">Email <span class="obrigatorio">*</span></label>
          <input id="email" name="email" type="email" th:value="${form?.email}" autocomplete="off" required>
        </div>

        <div class="field">
          <label for="senha">Senha inicial <span class="obrigatorio">*</span></label>
          <input id="senha" name="senha" type="password" autocomplete="new-password" required>
          <span class="field-dica"><span th:text="${regraSenha}"></span> O usuário pode trocá-la depois em "Meu perfil".</span>
        </div>

        <div class="field">
          <label for="perfil">Perfil</label>
          <select name="role" id="perfil">
            <option value="USER" th:selected="${form?.role?.name() == 'USER'}">Usuário</option>
            <option value="GESTOR" th:selected="${form?.role?.name() == 'GESTOR'}">Gestor</option>
            <option value="ADMIN" th:selected="${form?.role?.name() == 'ADMIN'}">Administrador</option>
            <option value="CUSTOM" th:selected="${form?.role?.name() == 'CUSTOM'}">Personalizado</option>
          </select>
          <span class="field-dica" id="perfilDescricao"></span>
        </div>

        <fieldset class="field span-2" style="border:0;padding:0;margin:0">
          <legend class="rotulo" style="margin-bottom:8px">Módulos</legend>
          <div class="chips">
            <label class="chip"><input type="checkbox" name="telas" value="CATALOGO" th:checked="${form?.telas != null and form.telas.contains('CATALOGO')}"><span>Catálogo</span></label>
            <label class="chip"><input type="checkbox" name="telas" value="RFID" th:checked="${form?.telas != null and form.telas.contains('RFID')}"><span>Etiquetas (RFID)</span></label>
            <label class="chip"><input type="checkbox" name="telas" value="LEITURA" th:checked="${form?.telas != null and form.telas.contains('LEITURA')}"><span>Leituras</span></label>
            <label class="chip"><input type="checkbox" name="telas" value="DASHBOARD" th:checked="${form?.telas != null and form.telas.contains('DASHBOARD')}"><span>Relatórios</span></label>
            <label class="chip"><input type="checkbox" name="telas" value="USUARIO" th:checked="${form?.telas != null and form.telas.contains('USUARIO')}"><span>Usuários</span></label>
          </div>
        </fieldset>

        <fieldset class="field span-2" style="border:0;padding:0;margin:0">
          <legend class="rotulo" style="margin-bottom:8px">O que pode fazer nesses módulos</legend>
          <div class="chips">
            <label class="chip"><input type="checkbox" name="permissoes" value="READ" th:checked="${form?.permissoes != null and form.permissoes.contains('READ')}"><span>Ver</span></label>
            <label class="chip"><input type="checkbox" name="permissoes" value="CREATE" th:checked="${form?.permissoes != null and form.permissoes.contains('CREATE')}"><span>Criar</span></label>
            <label class="chip"><input type="checkbox" name="permissoes" value="UPDATE" th:checked="${form?.permissoes != null and form.permissoes.contains('UPDATE')}"><span>Editar</span></label>
            <label class="chip"><input type="checkbox" name="permissoes" value="DELETE" th:checked="${form?.permissoes != null and form.permissoes.contains('DELETE')}"><span>Excluir</span></label>
          </div>
        </fieldset>

      </div>
    </div>

    <div class="card-footer">
      <a th:href="@{/admin/usuarios}" class="btn btn-ghost">Cancelar</a>
      <button type="submit" class="btn btn-primary">Criar usuário</button>
    </div>
  </form>

  <script>
    (function () {
      const perfil = document.getElementById("perfil");
      const descricao = document.getElementById("perfilDescricao");
      const modulos = document.querySelectorAll("input[name='telas']");
      const permissoes = document.querySelectorAll("input[name='permissoes']");

      // Perfis prontos: as caixas só mostram o que o perfil já inclui (o servidor define as permissões)
      const PERFIS = {
        USER:   { modulos: "todos", acoes: ["READ"], texto: "Só consulta: vê tudo, não altera nada." },
        GESTOR: { modulos: "todos", acoes: ["READ", "CREATE", "UPDATE"], texto: "Consulta, cadastra e edita. Não exclui nem gerencia usuários." },
        ADMIN:  { modulos: "todos", acoes: ["READ", "CREATE", "UPDATE", "DELETE"], texto: "Acesso total, inclusive gestão de usuários." },
        CUSTOM: { texto: "Escolha os módulos e o que o usuário pode fazer neles." }
      };

      // inicial=true: na volta de um erro, mantém as caixas que o usuário marcou no perfil Personalizado
      function atualizarPermissoes(inicial) {
        const p = PERFIS[perfil.value];
        descricao.textContent = p.texto;

        if (perfil.value === "CUSTOM") {
          modulos.forEach(m => { m.disabled = false; if (!inicial) m.checked = false; });
          permissoes.forEach(a => { a.disabled = false; if (!inicial) a.checked = false; });
          return;
        }

        modulos.forEach(m => { m.checked = true; m.disabled = true; });
        permissoes.forEach(a => { a.checked = p.acoes.includes(a.value); a.disabled = true; });
      }

      perfil.addEventListener("change", () => atualizarPermissoes(false));
      atualizarPermissoes(true);
    })();
  </script>

</section>
</html>
