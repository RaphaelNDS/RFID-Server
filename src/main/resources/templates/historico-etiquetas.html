<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">

<title>Histórico de etiquetas · Sistema RFID</title>

<section class="page">

  <div class="page-header">
    <div>
      <h1 th:text="${tagFiltrada != null} ? 'Histórico da etiqueta' : 'Histórico de etiquetas'">Histórico de etiquetas</h1>
      <p class="subtitulo mono" th:if="${tagFiltrada != null}" th:text="${tagFiltrada}"></p>
      <p class="subtitulo" th:unless="${tagFiltrada != null}">As últimas mudanças no cadastro de etiquetas (cadastro, alteração e exclusão)</p>
    </div>
    <a th:href="@{/admin/tags-cadastradas}" class="btn btn-ghost">
      <svg class="ic"><use href="/img/icones.svg#voltar"/></svg>Etiquetas
    </a>
  </div>

  <div class="card">
    <form method="get" class="toolbar">
      <div class="field">
        <label for="f-tag">Etiqueta (EPC)</label>
        <input id="f-tag" name="tag" class="mono" th:value="${tagFiltrada}" placeholder="Também encontra etiquetas excluídas">
      </div>
      <button type="submit" class="btn btn-primary">
        <svg class="ic"><use href="/img/icones.svg#busca"/></svg>Buscar
      </button>
      <a th:href="@{/admin/etiquetas/historico}" class="btn btn-ghost" th:if="${tagFiltrada != null}">Últimas mudanças</a>
    </form>

    <div class="table-wrap">
      <table class="table" th:unless="${#lists.isEmpty(linhas)}">
        <thead>
        <tr>
          <th>Quando</th>
          <th th:unless="${tagFiltrada != null}">Etiqueta (EPC)</th>
          <th>O que</th>
          <th>Campo</th>
          <th>Antes</th>
          <th>Depois</th>
          <th>Quem</th>
          <th>Por onde</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="h : ${linhas}">
          <td class="nowrap" th:text="${#temporals.format(h.momento, 'dd/MM/yyyy HH:mm:ss')}"></td>
          <td class="mono" th:unless="${tagFiltrada != null}">
            <a th:href="@{/admin/etiquetas/historico(tag=${h.tagReal})}" th:text="${h.tagReal}"></a>
          </td>
          <td>
            <span class="badge badge-online" th:if="${h.acao.name() == 'CADASTRO'}" th:text="${h.acao.rotulo}"></span>
            <span class="badge" th:if="${h.acao.name() == 'ALTERACAO'}" th:text="${h.acao.rotulo}"></span>
            <span class="badge badge-CUSTOM" th:if="${h.acao.name() == 'EXCLUSAO'}" th:text="${h.acao.rotulo}"></span>
          </td>
          <td th:text="${h.campo != null} ? ${h.campo} : '—'"></td>
          <td th:text="${h.valorAntigo != null and !#strings.isEmpty(h.valorAntigo)} ? ${h.valorAntigo} : '—'"></td>
          <td th:text="${h.valorNovo != null and !#strings.isEmpty(h.valorNovo)} ? ${h.valorNovo} : '—'"></td>
          <td th:text="${h.usuario}"></td>
          <td th:text="${h.origem}"></td>
        </tr>
        </tbody>
      </table>

      <div class="vazio" th:if="${#lists.isEmpty(linhas)}">
        <svg class="ic"><use href="/img/icones.svg#relogio"/></svg>
        <strong th:text="${tagFiltrada != null} ? 'Nenhum registro para esta etiqueta' : 'Nenhuma mudança registrada ainda'"></strong>
        O histórico começa a partir desta versão do servidor: cadastros anteriores não têm registro.
      </div>
    </div>
  </div>

</section>
</html>
