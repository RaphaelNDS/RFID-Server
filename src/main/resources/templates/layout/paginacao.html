<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- Paginação das telas de lista: os links já levam os filtros aplicados (controller/Paginacao.kt, adicionarPaginacao) -->
<nav th:fragment="paginacao" class="card-footer paginacao" th:if="${totalPaginas > 1}" aria-label="Páginas">
  <a th:if="${linkAnterior != null}" th:href="@{${linkAnterior}}" class="btn btn-secondary btn-sm" rel="prev">
    <svg class="ic"><use href="/img/icones.svg#voltar"/></svg>Anterior
  </a>
  <span class="muted" th:text="'Página ' + ${paginaAtual} + ' de ' + ${totalPaginas}">Página 1 de 1</span>
  <a th:if="${linkProxima != null}" th:href="@{${linkProxima}}" class="btn btn-secondary btn-sm" rel="next">
    Próxima<svg class="ic" style="transform:scaleX(-1)"><use href="/img/icones.svg#voltar"/></svg>
  </a>
</nav>
</html>
