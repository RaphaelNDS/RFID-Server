<!--
  Local e situação do equipamento, no cadastro e na edição da etiqueta. O modelo precisa de "cadastro"
  (CadastroRequest), "opcoesLocal" (OpcaoLocal) e "situacoesEditaveis". Desativados só aparecem se já forem os do bem.

  A situação só aparece para escolher quando é uma das editáveis (No estoque, Extraviado); "Fora do estoque" vem das
  movimentações (saída e entrada) e "Baixado", de "Dar baixa".
-->
<th:block th:fragment="campos" xmlns:th="http://www.thymeleaf.org">
  <div class="field">
    <label for="localId">Local</label>
    <select id="localId" name="localId">
      <option value="">Sem local</option>
      <option th:each="l : ${opcoesLocal}" th:if="${l.ativo or l.id == cadastro.localId}"
              th:value="${l.id}" th:text="${l.descricao} + (${l.ativo} ? '' : ' (desativado)')"
              th:selected="${cadastro.localId != null and l.id == cadastro.localId}"></option>
    </select>
    <span class="field-dica">Onde o equipamento fica guardado. Atualizado sozinho quando um inventário finalizado o encontra em outro local.
      <a th:href="@{/admin/locais}" th:if="${@authService.temPermissao('CATALOGO','READ')}">Locais</a></span>
  </div>

  <th:block th:with="editavel=${cadastro.situacao == null or #lists.contains(situacoesEditaveis.![name()], cadastro.situacao)}">
    <div class="field" th:if="${editavel}">
      <label for="situacao">Situação</label>
      <select id="situacao" name="situacao">
        <option th:each="s : ${situacoesEditaveis}" th:value="${s.name()}" th:text="${s.rotulo}"
                th:selected="${(cadastro.situacao == null and s.name() == 'DISPONIVEL') or s.name() == cadastro.situacao}"></option>
      </select>
      <span class="field-dica">"Fora do estoque" vem das movimentações (saída e entrada); "Baixado", de "Dar baixa".</span>
    </div>
    <div class="field" th:unless="${editavel}">
      <label>Situação</label>
      <input type="text" th:value="${T(org.example.model.SituacaoBem).valueOf(cadastro.situacao).rotulo}" readonly>
      <span class="field-dica">Muda pela entrada do equipamento (Movimentações) ou pela baixa.</span>
    </div>
  </th:block>
</th:block>
