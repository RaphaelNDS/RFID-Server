<div th:fragment="header"
     class="header"
     xmlns:th="http://www.thymeleaf.org"
     xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

  <div class="header-container">

    <!-- LOGO -->
    <div class="header-left">
      <div class="logo">
        🛠 Sistema RFID
      </div>
    </div>

    <!-- NAV -->
    <nav class="nav" sec:authorize="isAuthenticated()">

      <!-- HOME DINÂMICO -->
<!--      <a th:href="@{/redirect}">Home</a>-->
      <a th:href="@{/dashboard}">Home</a>
      <!-- TAGS -->
      <a th:href="@{/admin/tags-cadastradas}"
         sec:authorize="hasRole('ADMIN')">
        Tags
      </a>

      <a th:href="@{/admin/tags-pendentes}"
         sec:authorize="hasRole('ADMIN')">
        Pendentes
      </a>

      <!-- CADASTRO -->
      <a th:href="@{/admin/cadastro}"
         th:if="${@authService.temPermissao('TAG','CREATE')}">
        Cadastro
      </a>

      <!-- LEITURAS ESTOQUE -->
      <a th:href="@{/admin/leituras-android}"
         sec:authorize="hasRole('ADMIN')">
        Leituras
      </a>

      <!-- EXPEDIÇÃO -->
      <a th:href="@{/expedicao}"
         sec:authorize="hasRole('USER')">
        Expedição
      </a>

      <!-- CATÁLOGO -->
      <a th:href="@{/admin/catalogo}"
         sec:authorize="hasRole('ADMIN')">
        Catálogo
      </a>

      <!-- DASHBOARD -->
      <a th:href="@{/admin/dashboard}"
         sec:authorize="hasRole('ADMIN')">
        Dashboard
      </a>

      <!-- USUÁRIOS -->
      <a th:href="@{/admin/usuarios/novo}"
         sec:authorize="hasRole('ADMIN')">
        Usuários
      </a>

    </nav>

    <!-- RIGHT -->
    <div class="header-right">

      <!-- THEME -->
      <button class="theme-toggle" type="button" onclick="toggleTheme()">
        🌙 / ☀
      </button>

      <!-- PROFILE -->
      <div class="profile-menu" id="profileMenu">

        <div class="profile-name" id="profileBtn">

          <span sec:authorize="isAuthenticated()"
                sec:authentication="principal.nome"></span>

          <span sec:authorize="!isAuthenticated()">
            Visitante
          </span> ⌄

        </div>

        <div class="profile-dropdown" id="profileDropdown">

          <div sec:authorize="isAuthenticated()">
            <a th:href="@{/perfil}">Meu Perfil</a>
            <a th:href="@{/perfil/senha}">Alterar Senha</a>
            <a th:href="@{/perfil/email}">Alterar Email</a>

            <form th:action="@{/logout}" method="post">
              <button type="submit" class="logout-btn">Sair</button>
            </form>
          </div>

          <div sec:authorize="!isAuthenticated()">
            <a th:href="@{/login}">Login</a>
          </div>

        </div>

      </div>

    </div>
  </div>
</div>

<!-- JS -->
<script>
  document.addEventListener("DOMContentLoaded", function(){

    const profileBtn = document.getElementById("profileBtn");
    const dropdown = document.getElementById("profileDropdown");

    if(profileBtn && dropdown){

      profileBtn.addEventListener("click", function(e){
        e.stopPropagation();
        dropdown.classList.toggle("active");
      });

      dropdown.addEventListener("click", function(e){
        e.stopPropagation();
      });

      document.addEventListener("click", function(){
        dropdown.classList.remove("active");
      });
    }

    // tema persistente
    const saved = localStorage.getItem("theme");
    if(saved === "dark"){
      document.body.classList.add("dark");
    }

  });

  function toggleTheme(){
    document.body.classList.toggle("dark");
    localStorage.setItem(
      "theme",
      document.body.classList.contains("dark") ? "dark" : "light"
    );
  }
</script>
