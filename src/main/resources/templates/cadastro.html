<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">

<title>Cadastrar etiqueta · Sistema RFID</title>

<section class="page page-estreita">

  <div class="page-header">
    <div>
      <h1>Cadastrar etiqueta</h1>
      <p class="subtitulo">Vincule uma etiqueta RFID a um equipamento do catálogo</p>
    </div>
  </div>

  <div class="alert alert-erro" th:if="${erro}" role="alert">
    <svg class="ic"><use href="/img/icones.svg#alerta"/></svg><span th:text="${erro}"></span>
  </div>
  <div class="alert alert-ok" th:if="${msg}" role="status">
    <svg class="ic"><use href="/img/icones.svg#ok"/></svg><span th:text="${msg}"></span>
  </div>

  <form class="card" th:action="@{/admin/cadastro/salvar}" th:object="${cadastro}" method="post">
    <div class="card-body">
      <div class="form-grid">

        <div class="field span-2">
          <label for="tag">Etiqueta RFID (EPC) <span class="obrigatorio">*</span></label>
          <input type="text" id="tag" th:field="*{tag}" class="mono"
                 th:readonly="${!#strings.isEmpty(cadastro.tag)}" required
                 placeholder="Leia a etiqueta no coletor ou digite o código">
          <span class="field-dica" th:if="${!#strings.isEmpty(cadastro.tag)}">Etiqueta vinda da lista de pendentes.</span>
        </div>

        <div class="field">
          <label for="codigoInterno">Código interno <span class="obrigatorio">*</span></label>
          <input type="text" id="codigoInterno" th:field="*{codigoInterno}" placeholder="Ex.: 0.111.222.333" required>
        </div>

        <div class="field">
          <label for="patrimonio">Patrimônio</label>
          <input type="text" id="patrimonio" th:field="*{patrimonio}">
        </div>

        <div class="field">
          <label for="tipoSelect">Tipo de equipamento</label>
          <select id="tipoSelect" name="tipoEquipamentoId">
            <option value="">Selecione o tipo</option>
            <option th:each="t : ${tipos}" th:value="${t.id}" th:text="${t.nome}"></option>
          </select>
        </div>

        <div class="field">
          <label for="marcaSelect">Marca</label>
          <select id="marcaSelect" name="marcaId" disabled>
            <option value="">Escolha o tipo primeiro</option>
          </select>
        </div>

        <div class="field">
          <label for="modeloSelect">Modelo</label>
          <select id="modeloSelect" name="modeloId" disabled>
            <option value="">Escolha a marca primeiro</option>
          </select>
        </div>

        <div class="field">
          <label for="numeroSerie">Nº de série</label>
          <input type="text" id="numeroSerie" th:field="*{numeroSerie}">
        </div>

      </div>
      <p class="field-dica" style="margin-top:16px">
        Para aparecer nas leituras e relatórios, a etiqueta precisa de tipo, marca, modelo, patrimônio e nº de série.
      </p>
    </div>

    <div class="card-footer">
      <a th:href="@{/admin/tags-pendentes}" class="btn btn-ghost">Cancelar</a>
      <button type="submit" class="btn btn-primary">Salvar etiqueta</button>
    </div>
  </form>

  <script>
    (function () {
      const tipoSelect   = document.getElementById("tipoSelect");
      const marcaSelect  = document.getElementById("marcaSelect");
      const modeloSelect = document.getElementById("modeloSelect");

      // Preenche um <select> com a lista vinda da API (texto via textContent, sem HTML)
      function preencher(select, lista, vazio, nenhum) {
        select.innerHTML = "";
        select.appendChild(new Option(lista.length ? vazio : nenhum, ""));
        lista.forEach(item => select.appendChild(new Option(item.nome, item.id)));
        select.disabled = lista.length === 0;
      }

      function carregar(url, select, vazio, nenhum) {
        select.disabled = true;
        select.innerHTML = "";
        select.appendChild(new Option("Carregando…", ""));
        return fetch(url)
          .then(res => { if (!res.ok) throw new Error(res.status); return res.json(); })
          .then(lista => preencher(select, lista, vazio, nenhum))
          .catch(() => { select.innerHTML = ""; select.appendChild(new Option("Erro ao carregar", "")); });
      }

      function resetar(select, texto) {
        select.innerHTML = "";
        select.appendChild(new Option(texto, ""));
        select.disabled = true;
      }

      tipoSelect.addEventListener("change", function () {
        resetar(modeloSelect, "Escolha a marca primeiro");
        if (!this.value) return resetar(marcaSelect, "Escolha o tipo primeiro");
        carregar("/api/catalogo/marcas?tipoId=" + this.value, marcaSelect, "Selecione a marca", "Nenhuma marca para este tipo");
      });

      marcaSelect.addEventListener("change", function () {
        if (!this.value) return resetar(modeloSelect, "Escolha a marca primeiro");
        carregar("/api/catalogo/modelos?marcaId=" + this.value, modeloSelect, "Selecione o modelo", "Nenhum modelo para esta marca");
      });
    })();
  </script>

</section>
</html>
