<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">

<title>Etiquetas · Sistema RFID</title>

<section class="page">

  <div class="page-header">
    <div>
      <h1>Etiquetas cadastradas</h1>
      <p class="subtitulo">Equipamentos identificados por etiqueta RFID</p>
    </div>
    <div class="page-header-acoes" th:if="${@authService.temPermissao('RFID','CREATE')}">
      <a th:href="@{/admin/cadastro}" class="btn btn-primary">
        <svg class="ic"><use href="/img/icones.svg#mais"/></svg>Cadastrar etiqueta
      </a>
    </div>
  </div>

  <div class="card">
    <div class="toolbar">
      <div class="field busca">
        <label for="filtroTabela" class="sr-only">Buscar</label>
        <svg class="ic"><use href="/img/icones.svg#busca"/></svg>
        <input id="filtroTabela" type="search" placeholder="Buscar por etiqueta, código, patrimônio, série, tipo, marca ou modelo">
      </div>
      <span class="muted nowrap" id="contagem" th:text="${#lists.size(tags)} + ' etiqueta(s)'"></span>
    </div>

    <div class="table-wrap">
      <table class="table" id="tabela">
        <thead>
        <tr>
          <th>Etiqueta (EPC)</th>
          <th>Código</th>
          <th>Patrimônio</th>
          <th>Tipo</th>
          <th>Marca</th>
          <th>Modelo</th>
          <th>Nº série</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="t : ${tags}">
          <td class="mono" th:text="${t.tag}"></td>
          <td class="principal" th:text="${t.codigoInterno}"></td>
          <td th:text="${t.patrimonio}"></td>
          <td th:text="${t.tipoNome} ?: '—'"></td>
          <td th:text="${t.marcaNome} ?: '—'"></td>
          <td th:text="${t.modeloNome} ?: '—'"></td>
          <td th:text="${t.numeroSerie}"></td>
        </tr>
        </tbody>
      </table>

      <div class="vazio" th:if="${#lists.isEmpty(tags)}">
        <svg class="ic"><use href="/img/icones.svg#etiqueta"/></svg>
        <strong>Nenhuma etiqueta cadastrada</strong>
        As etiquetas aparecem aqui depois de cadastradas.
      </div>
      <div class="vazio" id="semResultado" hidden>
        <svg class="ic"><use href="/img/icones.svg#busca"/></svg>
        <strong>Nada encontrado</strong>
        Nenhuma etiqueta corresponde à busca.
      </div>
    </div>
  </div>

  <script th:replace="~{layout/filtro-tabela :: script}"></script>

</section>
</html>
