<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">

<title>Novo tipo de equipamento · Sistema RFID</title>

<section class="page" style="max-width:520px">

  <div class="page-header">
    <div>
      <h1>Novo tipo de equipamento</h1>
      <p class="subtitulo">Ex.: Notebook, Monitor, Impressora</p>
    </div>
  </div>

  <form class="card" th:action="@{/admin/tipo-equipamento/salvar}" th:object="${tipo}" method="post">
    <div class="card-body">
      <div class="field">
        <label for="nome">Nome do tipo</label>
        <input id="nome" type="text" th:field="*{nome}" required autofocus>
        <span class="field-dica">Marcas e modelos são cadastrados depois, na tela do catálogo.</span>
      </div>
    </div>
    <div class="card-footer">
      <a th:href="@{/admin/catalogo}" class="btn btn-ghost">Cancelar</a>
      <button type="submit" class="btn btn-primary">Salvar tipo</button>
    </div>
  </form>

</section>
</html>
