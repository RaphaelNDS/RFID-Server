<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">

<title>Novo pedido · Sistema RFID</title>

<section class="page page-estreita">

  <div class="page-header">
    <div>
      <h1>Novo pedido de locação</h1>
      <p class="subtitulo">Primeiro o cliente e as datas; na tela seguinte, os equipamentos do pedido</p>
    </div>
    <a th:href="@{/admin/pedidos}" class="btn btn-ghost"><svg class="ic"><use href="/img/icones.svg#voltar"/></svg>Voltar</a>
  </div>

  <div class="alert alert-erro" th:if="${erro}" role="alert">
    <svg class="ic"><use href="/img/icones.svg#alerta"/></svg><span th:text="${erro}"></span>
  </div>
  <div class="alert alert-aviso" th:if="${#lists.isEmpty(clientes)}" role="note">
    <svg class="ic"><use href="/img/icones.svg#alerta"/></svg>
    <span>Nenhum cliente cadastrado. <a th:href="@{/admin/clientes}">Cadastre o cliente</a> antes do pedido.</span>
  </div>

  <form class="card" th:action="@{/admin/pedidos}" method="post" data-enviar-uma-vez>
    <div class="card-body">
      <div class="form-grid">
        <div class="field span-2">
          <label for="cliente">Cliente <span class="obrigatorio">*</span></label>
          <select id="cliente" name="cliente" required>
            <option value="">Escolha o cliente</option>
            <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.descricao}"
                    th:selected="${dados.clienteId != null and c.id == dados.clienteId}"></option>
          </select>
          <span class="field-dica"><a th:href="@{/admin/clientes}">Clientes</a></span>
        </div>
        <div class="field">
          <label for="saida">Saída prevista</label>
          <input type="date" id="saida" name="saida" th:value="${saidaTexto} ?: ${dados.saidaPrevista}" th:min="${hoje}">
        </div>
        <div class="field">
          <label for="previsao">Devolução prevista <span class="obrigatorio">*</span></label>
          <input type="date" id="previsao" name="previsao" th:value="${previsaoTexto} ?: ${dados.previsaoDevolucao}" th:min="${hoje}" required>
        </div>
        <div class="field span-2">
          <label for="localEntrega">Local de entrega</label>
          <input type="text" id="localEntrega" name="localEntrega" maxlength="300" th:value="${dados.localEntrega}" placeholder="Vazio = o endereço do cliente">
        </div>
        <div class="field span-2">
          <label for="observacao">Observação</label>
          <input type="text" id="observacao" name="observacao" maxlength="500" th:value="${dados.observacao}">
        </div>
      </div>
    </div>
    <div class="card-footer">
      <a th:href="@{/admin/pedidos}" class="btn btn-ghost">Cancelar</a>
      <button type="submit" class="btn btn-primary" data-enviando="Criando...">
        <svg class="ic"><use href="/img/icones.svg#ok"/></svg>Criar pedido
      </button>
    </div>
  </form>

</section>
</html>
