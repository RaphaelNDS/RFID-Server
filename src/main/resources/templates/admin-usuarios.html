<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">

<title>Usuários · Sistema RFID</title>

<section class="page">

  <div class="page-header">
    <div>
      <h1>Usuários</h1>
      <p class="subtitulo">Quem acessa o sistema e com quais permissões</p>
    </div>
    <div class="page-header-acoes">
      <a th:href="@{/admin/usuarios/novo}" class="btn btn-primary">
        <svg class="ic"><use href="/img/icones.svg#mais"/></svg>Novo usuário
      </a>
    </div>
  </div>

  <div class="card">
    <div class="toolbar">
      <div class="field busca">
        <label for="filtroTabela" class="sr-only">Buscar</label>
        <svg class="ic"><use href="/img/icones.svg#busca"/></svg>
        <input id="filtroTabela" type="search" placeholder="Buscar por nome, email ou perfil">
      </div>
      <span class="muted nowrap" id="contagem" th:text="${#lists.size(usuarios)} + ' usuário(s)'"></span>
    </div>

    <div class="table-wrap">
      <table class="table" id="tabela">
        <thead>
        <tr>
          <th>Nome</th>
          <th>Email</th>
          <th>Perfil</th>
          <th>Permissões</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${usuarios}">
          <td class="principal">
            <span style="display:inline-flex;align-items:center;gap:10px">
              <span class="avatar" th:text="${#strings.toUpperCase(#strings.substring(u.nome, 0, 1))}">A</span>
              <span th:text="${u.nome}"></span>
            </span>
          </td>
          <td th:text="${u.email}"></td>
          <td>
            <span class="badge" th:classappend="'badge-' + ${u.role}" th:switch="${u.role.name()}">
              <th:block th:case="'ADMIN'">Administrador</th:block>
              <th:block th:case="'GESTOR'">Gestor</th:block>
              <th:block th:case="'USER'">Usuário</th:block>
              <th:block th:case="*">Personalizado</th:block>
            </span>
          </td>
          <td class="muted" th:text="${u.role.name() == 'ADMIN'} ? 'Acesso total' : ${#lists.size(u.permissoes)} + ' permissão(ões)'"></td>
        </tr>
        </tbody>
      </table>

      <div class="vazio" id="semResultado" hidden>
        <svg class="ic"><use href="/img/icones.svg#busca"/></svg>
        <strong>Nada encontrado</strong>
        Nenhum usuário corresponde à busca.
      </div>
    </div>
  </div>

  <script th:replace="~{layout/filtro-tabela :: script}"></script>

</section>
</html>
