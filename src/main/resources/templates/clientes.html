<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">

<title>Clientes · Sistema RFID</title>

<section class="page">

  <div class="page-header">
    <div>
      <h1>Clientes</h1>
      <p class="subtitulo">Quem aluga os equipamentos (pedidos de locação) e quem compra (vendas)</p>
    </div>
  </div>

  <div class="alert alert-ok" th:if="${msg}" role="status">
    <svg class="ic"><use href="/img/icones.svg#ok"/></svg><span th:text="${msg}"></span>
  </div>
  <div class="alert alert-erro" th:if="${erro}" role="alert">
    <svg class="ic"><use href="/img/icones.svg#alerta"/></svg><span th:text="${erro}"></span>
  </div>

  <form class="card" style="margin-bottom:20px" th:action="@{/admin/clientes}" method="post" th:if="${@authService.temPermissao('LOCACAO','CREATE')}">
    <div class="card-header"><h2>Novo cliente</h2></div>
    <div class="toolbar" style="border:0">
      <div class="field" style="flex:2 1 220px"><label for="c-nome">Nome ou razão social <span class="obrigatorio">*</span></label>
        <input id="c-nome" name="nome" maxlength="160" required></div>
      <div class="field"><label for="c-doc">CPF ou CNPJ</label><input id="c-doc" name="documento" maxlength="20" inputmode="numeric"></div>
      <div class="field"><label for="c-contato">Contato</label><input id="c-contato" name="contato" maxlength="160" placeholder="Pessoa de contato"></div>
      <div class="field"><label for="c-tel">Telefone</label><input id="c-tel" name="telefone" maxlength="40" inputmode="tel"></div>
      <div class="field" style="flex:2 1 200px"><label for="c-email">Email</label><input id="c-email" name="email" type="email" maxlength="160"></div>
      <div class="field" style="flex:3 1 280px"><label for="c-end">Endereço</label><input id="c-end" name="endereco" maxlength="300" placeholder="Usado como local de entrega dos pedidos"></div>
      <div class="field" style="flex:3 1 280px"><label for="c-obs">Observação</label><input id="c-obs" name="observacao" maxlength="500"></div>
      <button type="submit" class="btn btn-primary">Cadastrar</button>
    </div>
  </form>

  <div class="card">
    <form method="get" class="toolbar" role="search">
      <div class="field busca">
        <label for="busca" class="sr-only">Buscar</label>
        <svg class="ic"><use href="/img/icones.svg#busca"/></svg>
        <input id="busca" name="busca" type="search" th:value="${busca}" placeholder="Nome, CPF ou CNPJ">
      </div>
      <button type="submit" class="btn btn-primary">Buscar</button>
      <a th:if="${busca != ''}" th:href="@{/admin/clientes}" class="btn btn-ghost">Limpar</a>
      <span class="muted nowrap" style="align-self:center" th:text="${#lists.size(clientes)} + ' de ' + ${total} + ' cliente(s)'"></span>
    </form>
    <div class="table-wrap">
      <table class="table table-cartoes" th:unless="${#lists.isEmpty(clientes)}">
        <thead><tr><th>Cliente</th><th>Documento</th><th>Contato</th><th>Telefone</th><th>Email</th><th class="acoes"><span class="sr-only">Ações</span></th></tr></thead>
        <tbody>
        <tr th:each="c : ${clientes}" th:classappend="${!c.ativo} ? 'inativo'">
          <td class="principal cartao-titulo">
            <span th:text="${c.nome}"></span>
            <span class="badge badge-inativo" th:unless="${c.ativo}">desativado</span>
            <span class="badge badge-inativo" th:if="${c.restricao.name() == 'BLOQUEADO'}">bloqueado</span>
            <span class="badge badge-CUSTOM" th:if="${c.restricao.name() == 'APROVACAO'}">só com aprovação</span>
            <div class="muted" style="font-size:12px" th:if="${c.motivoRestricao != null}"
                 th:text="${c.restricao.rotulo} + ': ' + ${c.motivoRestricao} + ' (' + ${c.restricaoPor} + ', ' + ${#temporals.format(c.restricaoEm, 'dd/MM/yyyy')} + ')'"></div>
            <div class="muted" style="font-size:12px" th:if="${c.endereco != null}" th:text="${c.endereco}"></div>
          </td>
          <td data-rotulo="Documento" class="mono nowrap" th:text="${c.documentoFormatado} ?: '—'"></td>
          <td data-rotulo="Contato" th:text="${c.contato} ?: '—'"></td>
          <td data-rotulo="Telefone" class="nowrap" th:text="${c.telefone} ?: '—'"></td>
          <td data-rotulo="Email" th:text="${c.email} ?: '—'"></td>
          <td class="acoes">
            <a th:href="@{/admin/pedidos(situacao='TODOS',busca=${c.nome})}" class="btn btn-ghost btn-sm">
              <svg class="ic"><use href="/img/icones.svg#calendario"/></svg><span class="texto-btn">Pedidos</span>
            </a>
            <details th:if="${@authService.temPermissao('LOCACAO','UPDATE')}" style="display:inline-block">
              <summary class="btn btn-ghost btn-sm">Editar</summary>
              <form class="toolbar" style="border:0;padding:10px 0 0;justify-content:flex-end" th:action="@{/admin/clientes/{id}(id=${c.id})}" method="post">
                <div class="field"><label th:for="'cn-' + ${c.id}">Nome</label><input th:id="'cn-' + ${c.id}" name="nome" maxlength="160" required th:value="${c.nome}"></div>
                <div class="field"><label th:for="'cd-' + ${c.id}">CPF ou CNPJ</label><input th:id="'cd-' + ${c.id}" name="documento" maxlength="20" th:value="${c.documento}"></div>
                <div class="field"><label th:for="'cc-' + ${c.id}">Contato</label><input th:id="'cc-' + ${c.id}" name="contato" maxlength="160" th:value="${c.contato}"></div>
                <div class="field"><label th:for="'ct-' + ${c.id}">Telefone</label><input th:id="'ct-' + ${c.id}" name="telefone" maxlength="40" th:value="${c.telefone}"></div>
                <div class="field"><label th:for="'ce-' + ${c.id}">Email</label><input th:id="'ce-' + ${c.id}" name="email" type="email" maxlength="160" th:value="${c.email}"></div>
                <div class="field"><label th:for="'ca-' + ${c.id}">Endereço</label><input th:id="'ca-' + ${c.id}" name="endereco" maxlength="300" th:value="${c.endereco}"></div>
                <div class="field"><label th:for="'co-' + ${c.id}">Observação</label><input th:id="'co-' + ${c.id}" name="observacao" maxlength="500" th:value="${c.observacao}"></div>
                <label class="chip" style="align-self:center"><input type="checkbox" name="ativo" value="true" th:checked="${c.ativo}"><span>Ativo</span></label>
                <button type="submit" class="btn btn-secondary btn-sm">Salvar</button>
              </form>
            </details>
            <!-- 1.19.0: restrição (administrador ou gestor) -->
            <details th:if="${podeAprovar}" style="display:inline-block">
              <summary class="btn btn-ghost btn-sm">Restrição</summary>
              <form class="toolbar" style="border:0;padding:10px 0 0;justify-content:flex-end" th:action="@{/admin/clientes/{id}/restricao(id=${c.id})}" method="post">
                <div class="field"><label th:for="'cr-' + ${c.id}">Restrição</label>
                  <select th:id="'cr-' + ${c.id}" name="restricao">
                    <option th:each="r : ${restricoes}" th:value="${r.name()}" th:text="${r.rotulo}" th:title="${r.descricao}" th:selected="${r == c.restricao}"></option>
                  </select></div>
                <div class="field" style="flex:2 1 240px"><label th:for="'cm-' + ${c.id}">Motivo</label>
                  <input th:id="'cm-' + ${c.id}" name="motivo" maxlength="300" th:value="${c.motivoRestricao}" placeholder="Obrigatório para bloquear ou exigir aprovação"></div>
                <button type="submit" class="btn btn-secondary btn-sm">Salvar</button>
              </form>
            </details>
          </td>
        </tr>
        </tbody>
      </table>
      <div class="vazio" th:if="${#lists.isEmpty(clientes)}">
        <svg class="ic"><use href="/img/icones.svg#usuarios"/></svg>
        <strong th:text="${busca == ''} ? 'Nenhum cliente cadastrado' : 'Nada encontrado'"></strong>
        Cadastre os clientes para fazer os pedidos de locação.
      </div>
    </div>
  </div>

</section>
</html>
