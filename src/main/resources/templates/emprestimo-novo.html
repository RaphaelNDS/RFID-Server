<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">

<title>Novo empréstimo · Sistema RFID</title>

<section class="page page-estreita">

  <div class="page-header">
    <div>
      <h1>Novo empréstimo</h1>
      <p class="subtitulo">Os bens ficam "Emprestado" até a devolução. O local e o responsável do bem não mudam.</p>
    </div>
    <a th:href="@{/admin/emprestimos}" class="btn btn-ghost">
      <svg class="ic"><use href="/img/icones.svg#voltar"/></svg>Voltar
    </a>
  </div>

  <div class="alert alert-erro" th:if="${erro}" role="alert">
    <svg class="ic"><use href="/img/icones.svg#alerta"/></svg><span th:text="${erro}"></span>
  </div>

  <form th:action="@{/admin/emprestimos}" method="post" data-enviar-uma-vez>
    <div class="card">
      <div class="card-header empilhar">
        <h2>Bens <span class="contagem" th:if="${quantidade > 0}" th:text="'(' + ${quantidade} + ')'"></span></h2>
        <span class="muted" th:text="'Etiqueta (EPC) ou patrimônio, um por linha. Até ' + ${maximo} + ' bens. Só sai bem Em uso ou Em estoque.'"></span>
      </div>
      <div class="card-body">
        <div class="field">
          <label for="codigos" class="sr-only">Bens</label>
          <textarea id="codigos" name="codigos" rows="4" class="mono" th:text="${codigos}"
                    placeholder="E28011700000020A1B2C3D01&#10;000123"></textarea>
        </div>
        <div style="margin-top:10px">
          <button type="submit" class="btn btn-secondary btn-sm" th:formaction="@{/admin/emprestimos/novo}" formnovalidate>
            <svg class="ic"><use href="/img/icones.svg#busca"/></svg>Conferir bens
          </button>
        </div>

        <th:block th:if="${localizados != null}">
          <div class="alert alert-erro" style="margin:14px 0 0" th:unless="${#lists.isEmpty(localizados.naoEncontrados)}" role="alert">
            <svg class="ic"><use href="/img/icones.svg#alerta"/></svg>
            <span th:text="'Não encontrado(s) no cadastro: ' + ${#strings.listJoin(localizados.naoEncontrados, ', ')}"></span>
          </div>
          <div class="alert alert-erro" style="margin:14px 0 0" th:unless="${#lists.isEmpty(localizados.ambiguos)}" role="alert">
            <svg class="ic"><use href="/img/icones.svg#alerta"/></svg>
            <span th:text="'Patrimônio de mais de um bem (use a etiqueta): ' + ${#strings.listJoin(localizados.ambiguos, ', ')}"></span>
          </div>
        </th:block>
      </div>

      <div class="table-wrap" th:if="${localizados != null and !#lists.isEmpty(localizados.bens)}">
        <table class="table table-cartoes">
          <thead><tr><th>Patrimônio</th><th>Equipamento</th><th>Local</th><th>Situação</th></tr></thead>
          <tbody>
          <tr th:each="b : ${localizados.bens}" th:classappend="${!podemSair.contains(b.situacao)} ? 'inativo'">
            <td class="principal cartao-titulo">
              <span th:text="${b.patrimonio ?: b.codigoInterno ?: '—'}"></span>
              <div class="mono muted" style="font-size:12px" th:text="${b.tag}"></div>
            </td>
            <td data-rotulo="Equipamento" th:text="${b.descricao} ?: '—'"></td>
            <td data-rotulo="Local" th:text="${b.local} ?: '—'"></td>
            <td data-rotulo="Situação">
              <span class="badge" th:classappend="${podemSair.contains(b.situacao)} ? '' : 'badge-inativo'" th:text="${b.situacao.rotulo}"></span>
              <span class="muted" th:unless="${podemSair.contains(b.situacao)}"> não pode sair</span>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="card" style="margin-top:16px">
      <div class="card-header"><h2>Empréstimo</h2></div>
      <div class="card-body">
        <div class="form-grid">
          <div class="field span-2">
            <label for="responsavel">Com quem vai <span class="obrigatorio">*</span></label>
            <select id="responsavel" name="responsavel" required>
              <option value="">Escolha o responsável</option>
              <option th:each="r : ${opcoesResponsavel}" th:value="${r.id}" th:text="${r.descricao}"
                      th:selected="${responsavel != null and r.id == responsavel}"></option>
            </select>
            <span class="field-dica">Quem não está na lista é cadastrado em
              <a th:href="@{/admin/responsaveis}" th:if="${@authService.temPermissao('CATALOGO','READ')}">Responsáveis</a><span th:unless="${@authService.temPermissao('CATALOGO','READ')}">Responsáveis</span>.</span>
          </div>
          <div class="field">
            <label for="saida">Saída</label>
            <input type="date" id="saida" name="saida" th:value="${saida}" th:max="${hoje}">
          </div>
          <div class="field">
            <label for="previsao">Devolução prevista <span class="obrigatorio">*</span></label>
            <input type="date" id="previsao" name="previsao" th:value="${previsao}" th:min="${hoje}" required>
          </div>
          <div class="field span-2">
            <label for="finalidade">Finalidade</label>
            <input type="text" id="finalidade" name="finalidade" maxlength="500" th:value="${finalidade}" placeholder="Ex.: evento na filial, home office, visita a cliente">
          </div>
        </div>
      </div>
      <div class="card-footer">
        <a th:href="@{/admin/emprestimos}" class="btn btn-ghost">Cancelar</a>
        <button type="submit" class="btn btn-primary" data-enviando="Registrando...">
          <svg class="ic"><use href="/img/icones.svg#ok"/></svg>Emprestar
        </button>
      </div>
    </div>
  </form>

</section>
</html>
